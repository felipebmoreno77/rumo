function privacyView(){return `<span class="rp-overline">Seus registros são seus</span><h1>Você escolhe o que compartilhar.</h1><p>Suas respostas, registros, criações, comparações, missões em dupla e próximos passos ficam salvos neste navegador, neste dispositivo. Não há sincronização com outros aparelhos. Limpar os dados do navegador ou usar navegação anônima pode apagar o progresso.</p><p>O login usa o Supabase e e-mails de confirmação. O Mentor gratuito prepara respostas guiadas neste navegador e não envia perguntas ou referências à OpenAI. O ditado pode usar o serviço de voz do navegador. O teste dura 24 horas corridas. Depois, o acesso vitalício custa R$ 19,90, com pagamento único por Pix e conferência manual.</p><p>Para acompanhar o uso e melhorar o Rumo, registramos eventos vinculados à conta, como início e conclusão do questionário, caminhos abertos e dias registrados. A administração vê estatísticas agregadas, sem o conteúdo das respostas, projetos ou registros das tarefas. Avaliações e mensagens enviadas em Suporte são compartilhadas com a administração; pedidos de atendimento incluem o e-mail da conta.</p><p>O mapa usa regras de exploração. Ele não mede talento, não é avaliação psicológica e não garante emprego ou renda.</p><p>“Recomeçar jornada” limpa as respostas, registros, feedback e o acesso simulado desta prévia após sua confirmação.</p><div class="rp-actions"><button class="rp-button rp-secondary" data-act="home">Voltar ao início</button><button class="rp-button rp-quiet" data-act="restart">Recomeçar jornada</button></div>`}

 (otp?'<label>Código de confirmação<input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>':'')+
 '<p id="ra-status" role="status" aria-live="polite"></p><button class="rp-button ra-submit" type="submit">'+({login:'Entrar',signup:'Criar conta',recover:'Enviar código',verify:'Confirmar e continuar',recovery:'Confirmar código',password:'Salvar nova senha'}[authMode])+'</button></form><div class="ra-links">'+
 (authMode==='login'?'<button class="rp-link" data-auth-mode="signup">Ainda não tenho conta</button><button class="rp-link" data-auth-mode="recover">Esqueci minha senha</button><button class="rp-link" data-auth-mode="verify-entry">Já recebi um código</button>':'<button class="rp-link" data-auth-mode="login">Voltar para entrar</button>')+

 '</div><small>Sua compra é vinculada à conta. O progresso da jornada fica neste navegador.</small></div></section>';
}
function supportForms(){return `<section class="su-forms"><article class="ad-card"><span class="rp-overline">PREFERE REGISTRAR POR AQUI?</span><h2>Envie um pedido de suporte.</h2><p>Sua mensagem e o e-mail da conta serão enviados à administração do Rumo para atendimento. Não envie senhas ou códigos.</p><form data-support-form><label>Assunto<select name="category" required>${Object.entries(ticketCategories).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label><label>Como podemos ajudar?<textarea name="message" rows="4" minlength="10" maxlength="1500" required placeholder="Conte o que aconteceu e em qual tela…"></textarea></label><button class="rp-button" type="submit">Enviar pedido →</button><p role="status" data-form-status></p></form></article><article class="ad-card"><span class="rp-overline">AJUDE O RUMO A EVOLUIR</span><h2>Como está sendo usar o app?</h2><p>Sua avaliação ajuda a melhorar a experiência. Envie apenas o que quiser compartilhar com a administração.</p><form data-review-form><fieldset class="su-rating"><legend>Sua nota para o Rumo</legend>${[1,2,3,4,5].map(v=>`<label><input type="radio" name="rating" value="${v}" required><span>${v} ★</span></label>`).join('')}</fieldset><label>O que podemos melhorar? <small>(opcional)</small><textarea name="comment" rows="4" maxlength="500" placeholder="Uma ideia, uma dificuldade ou algo que você gostou…"></textarea></label><button class="rp-button rp-secondary" type="submit">Enviar avaliação →</button><p role="status" data-form-status></p></form></article></section>`;}

function closeMenu(){menuOpen=false;navigation.hidden=true;root.querySelector('.rp-menu-shade').hidden=true;root.querySelector('.rp-main').inert=false;root.querySelector('[data-act=menu]').setAttribute('aria-expanded','false');}
function openMenu(){if(!authUser){showAuth();return;}menuOpen=true;navigation.hidden=false;root.querySelector('.rp-menu-shade').hidden=false;root.querySelector('.rp-main').inert=true;root.querySelector('[data-act=menu]').setAttribute('aria-expanded','true');navigation.querySelector('.rp-drawer-close').focus();}
function syncMenu(){navigation.querySelector('nav').innerHTML=[['home','Explorar','A página inicial do Rumo','house'],['start','Entrar no aplicativo','Sua jornada e seus projetos','compass'],['checkout','Meu acesso','Teste e acesso vitalício','badge-check'],['support','Suporte','Ajuda e contato com a equipe','headphones'],['privacy','Privacidade','Seus dados e sua conta','shield-check'],...(license?.admin?[['admin','Painel administrativo','Uso, suporte e compras','chart-no-axes-combined']]:[]),['logout','Desconectar da conta','Sair com segurança','log-out']].map(([act,title,sub,icon])=>`<button class="rp-drawer-item ${act===view?'rp-current':''}" data-act="${act}"><span class="rp-drawer-icon"><i data-lucide="${icon}" aria-hidden="true"></i></span><span class="rp-drawer-copy"><strong>${title}</strong><small>${sub}</small></span></button>`).join('');}
function render(){syncMenu();stage.innerHTML=view==='auth'?authView():view==='checkout'?checkoutView():view==='support'?supportView():view==='privacy'?privacyView():landingView();root.dataset.screen=view;if(typeof lucide!=='undefined')lucide.createIcons();}
function navigate(next){hidePixCopyToast();closeMenu();view=next;error='';statusMessage='';render();window.scrollTo({top:0,behavior:'instant'});live.textContent=next==='checkout'?'Seu acesso ao Rumo':next==='support'?'Suporte do Rumo':'Rumo';}
function showAuth(mode='login'){closeMenu();authMode=mode;view='auth';render();stage.querySelector('input')?.focus({preventScroll:true});}
async function loadLicense(){if(!authUser)return;const id=authUser.id;const d=await licenseApi('status');if(authUser?.id!==id)return;license=d;syncMenu();}
async function acceptUser(user){authUser=user;await loadLicense();navigate('checkout');}
async function enterApp(next='home'){
 if(!authUser){target=next;showAuth();return;}if(busy)return;busy=true;error='';
 try{await loadLicense();if(license.state==='ready')license=await licenseApi('start');if(license.allowed===true){const nextUrl='/app'+(selectedTopic?'?tema='+encodeURIComponent(selectedTopic):'')+(next==='home'?'':'#'+next);location.assign(nextUrl);return;}navigate('checkout');}
 catch(e){error=e.message;view='checkout';render();}finally{busy=false;}
}
let pixCopyToastTimer;
function hidePixCopyToast(){clearTimeout(pixCopyToastTimer);root.querySelector('#lp-copy-toast')?.remove();}
function showPixCopyToast(copied){
 hidePixCopyToast();const toast=document.createElement('div');toast.id='lp-copy-toast';toast.className='lp-copy-toast';toast.dataset.kind=copied?'success':'manual';toast.setAttribute('role','status');toast.setAttribute('aria-live','polite');toast.setAttribute('aria-atomic','true');
 const icon=document.createElement('span');icon.className='lp-copy-toast-icon';icon.setAttribute('aria-hidden','true');icon.textContent=copied?'✓':'!';
 const content=document.createElement('div'),title=document.createElement('strong'),detail=document.createElement('small');title.textContent=copied?'Código Pix copiado com sucesso':'O código está selecionado';detail.textContent=copied?'Cole em “Pix Copia e Cola” no seu banco. O valor de '+money(license.order.amountCents)+' já está no código.':'Copie o código selecionado e cole em “Pix Copia e Cola” no seu banco. O valor de '+money(license.order.amountCents)+' já está no código.';content.append(title,detail);
 const close=document.createElement('button');close.type='button';close.setAttribute('aria-label','Fechar aviso de cópia');close.textContent='×';close.addEventListener('click',hidePixCopyToast);toast.append(icon,content,close);root.append(toast);pixCopyToastTimer=setTimeout(hidePixCopyToast,7000);
}
async function copyPixCode(){
 const value=license?.pix?.payload,field=stage.querySelector('#lp-copy');if(!value||!field)throw new Error('Atualize os dados do Pix antes de copiar.');let copied=false;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);copied=true;}}catch{}
 if(!copied){field.focus();field.select();field.setSelectionRange(0,value.length);try{copied=document.execCommand?.('copy')===true;}catch{}}
 statusMessage=copied?'Código Pix copiado com sucesso. Cole em “Pix Copia e Cola” no seu banco. O valor de '+money(license.order.amountCents)+' já está no código.':'Não foi possível copiar automaticamente. O código está selecionado: use Copiar e cole em “Pix Copia e Cola”. O valor de '+money(license.order.amountCents)+' já está no código.';
 const status=stage.querySelector('#lp-status');if(status)status.textContent=statusMessage;showPixCopyToast(copied);
}

inel administrativo ↗</button></article>':`<article class="lp-card"><span class="lp-label">PAGAMENTO SIMPLES, COM CONFERÊNCIA</span><h2>${o?.status==='reported'?'Seu Pix está em conferência.':license.pix&&o?'Seu Pix, pronto para copiar.':'Como funciona a compra.'}</h2>${o?.status==='reported'?'<div class="lp-state"><strong>Pagamento informado</strong>A equipe precisa conferir o recebimento no banco antes de liberar o acesso. Informar que pagou não confirma o pagamento.</div>':''}${license.pix&&o?`<div class="lp-pix"><label for="lp-copy">Código Pix · ${money(o.amountCents)}</label><textarea id="lp-copy" readonly rows="5">${esc(license.pix.payload||'')}</textarea><button class="rp-button" data-license-action="copy">Copiar código Pix</button><p class="lp-key-guide">No aplicativo do seu banco, escolha <strong>Pix → Pix Copia e Cola</strong> e cole o código. O valor de <strong>${money(o.amountCents)}</strong> já está preenchido.</p><dl><dt>Recebedor</dt><dd>${esc(license.recipient)}</dd><dt>Referência do pedido no Rumo</dt><dd>${esc(license.pix.reference)}</dd><dt>Protocolo</dt><dd>${esc(o.id.slice(0,8).toUpperCase())}</dd></dl><p class="lp-fine">Confira o recebedor e o valor no seu banco antes de confirmar. O Pix não leva o número do pedido; guarde o comprovante e o protocolo acima para a conferência.</p>${o.status==='pending'?'<button class="rp-button" data-license-action="report">Já fiz o Pix →</button>':''}</div>`:`<ol class="lp-steps"><li>Toque em liberar o acesso para preparar seu pedido de R$ 19,90.</li><li>Copie o código Pix e cole em “Pix Copia e Cola” no seu banco. O valor de R$ 19,90 já está preenchido.</li><li>Volte ao Rumo e toque em “Já fiz o Pix”.</li><li>Após a equipe conferir o recebimento, o acesso vitalício será liberado nesta conta.</li></ol>${o?.status==='rejected'?'<div class="lp-state"><strong>Pedido não confirmado</strong>Se você realizou o pagamento, fale com o suporte antes de pagar novamente.</div>':o?.status==='expired'?'<div class="lp-state"><strong>Código anterior encerrado</strong>Se já pagou, fale com o suporte. Caso contrário, prepare um novo pedido.</div>':''}`}<p class="lp-fine">Se o Pix vier de outra pessoa ou não houver identificação, envie o comprovante pelo WhatsApp com o protocolo do pedido. Não faça um segundo pagamento enquanto aguarda a conferência.</p><a class="rp-link" href="https://wa.me/5511984184934?text=${encodeURIComponent('Olá! Preciso de ajuda com o acesso ao Rumo.'+(o?' Protocolo: '+o.id.slice(0,8).toUpperCase():''))}" target="_blank" rel="noopener noreferrer">Falar com o suporte ↗</a><p class="lp-fine" role="status" id="lp-status">${esc(statusMessage)}</p></article>`}</div><section class="lp-faq"><details><summary>Quando começam as 24 horas?</summary><p>Ao tocar em “Começar minhas 24 horas” após entrar na conta. São 24 horas corridas, registradas no servidor. Sair da conta, trocar de aparelho ou limpar o navegador não reinicia o teste.</p></details><details><summary>Vou ser cobrado automaticamente?</summary><p>Não. O teste não pede cartão e não faz cobrança. Depois dele, você escolhe se quer fazer o Pix para comprar o acesso.</p></details><details><summary>Como a compra é liberada?</summary><p>O Pix é conferido manualmente pela administração. O botão “Já fiz o Pix” envia o pedido para conferência. Quando o recebimento for confirmado, esta conta terá acesso vitalício.</p></details><details><summary>O que acontece com meus registros?</summary><p>Os registros continuam neste navegador. Encerrar o teste não apaga a jornada. A compra libera o acesso da conta em outros aparelhos, mas ainda não sincroniza os registros entre dispositivos.</p></details></section>`}</section>`;

root.addEventListener('click',async e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.hasAttribute('data-password-toggle')){const input=b.parentElement.querySelector('input');input.type=input.type==='password'?'text':'password';b.textContent=input.type==='password'?'Mostrar':'Ocultar';return;}
 if(b.dataset.authMode){if(b.dataset.authMode==='home')navigate('home');else showAuth(b.dataset.authMode==='verify-entry'?'verify':b.dataset.authMode);return;}
 if(b.hasAttribute('data-auth-resend')){if(authBusy)return;b.disabled=true;try{const d=await authCall(authMode==='recovery'?'recover':'resend',{email:authEmail});stage.querySelector('#ra-status').textContent=d.message;}catch(e){stage.querySelector('#ra-status').textContent=e.message;}finally{b.disabled=false;}return;}
 if(b.dataset.yTopicOpen){selectedTopic=b.dataset.yTopicOpen;target='question';await enterApp('question');return;}
 if(b.dataset.act){
  const act=b.dataset.act;if(act==='home'){navigate('home');return;}if(act==='close-menu'){closeMenu();return;}if(act==='menu'){if(menuOpen)closeMenu();else openMenu();return;}
  if(!authUser){target=act==='duo'?'duo':act==='start'||act==='example'?'question':'home';showAuth();return;}
  if(act==='logout'){try{await authCall('logout');authUser=null;license=null;requestId=null;navigate('home');}catch(e){live.textContent=e.message;}return;}
  if(['checkout','support','privacy'].includes(act)){navigate(act);if(act==='checkout')try{await loadLicense();render();}catch(e){error=e.message;render();}return;}
  if(act==='how'){navigate('home');stage.querySelector('#how')?.scrollIntoView({behavior:'smooth'});return;}
  await enterApp(act==='duo'?'duo':act==='admin'?'admin':act==='start'||act==='example'?'question':'home');return;
 }
 if(b.hasAttribute('data-mentor-open')){await enterApp('mentor');return;}
 if(b.dataset.licenseAction){
  const action=b.dataset.licenseAction;if(action==='enter'){await enterApp(target);return;}if(busy)return;busy=true;error='';
  try{
   if(action==='copy'){await copyPixCode();return;}
   if(action==='create'){render();requestId=requestId||crypto.randomUUID();license=await licenseApi('create',{requestId});requestId=null;}
   if(action==='report')license=await licenseApi('report',{orderId:license.order.id});
   if(action==='refresh')await loadLicense();
  }catch(e){error=e.message;if(e.status===401){authUser=null;license=null;showAuth();return;}}
  finally{busy=false;}
  render();
 }
});
root.addEventListener('submit',async e=>{
 const f=e.target;if(f.id!=='ra-form')return;e.preventDefault();if(authBusy)return;const fields=new FormData(f),status=f.querySelector('#ra-status'),button=f.querySelector('[type=submit]');authEmail=String(fields.get('email')||authEmail).trim();
 if(authMode==='signup'&&fields.get('password')!==fields.get('passwordConfirm')){status.textContent='As senhas não coincidem. Digite a mesma senha nos dois campos.';return;}
 authBusy=true;button.disabled=true;status.textContent='Aguarde…';
 try{if(authMode==='login'){const d=await authCall('login',{email:authEmail,password:fields.get('password')});await acceptUser(d.user);}
 else if(authMode==='signup'){const d=await authCall('signup',{email:authEmail,password:fields.get('password')});showAuth('verify');stage.querySelector('#ra-status').textContent=d.message;}
 else if(authMode==='recover'){const d=await authCall('recover',{email:authEmail});showAuth('recovery');stage.querySelector('#ra-status').textContent=d.message;}
 else if(['verify','recovery'].includes(authMode)){const d=await authCall('verify',{email:authEmail,code:fields.get('code'),type:authMode==='recovery'?'recovery':'signup'});if(authMode==='recovery')showAuth('password');else await acceptUser(d.user);}
 else if(authMode==='password'){await authCall('password',{password:fields.get('password')});authUser=null;license=null;showAuth('login');stage.querySelector('#ra-status').textContent='Senha atualizada. Entre com sua nova senha.';}}
 catch(e){status.textContent=e.message;}finally{const p=f.querySelector('[name=password]');if(p)p.value='';authBusy=false;button.disabled=false;}
});
root.addEventListener('submit',async e=>{
 const form=e.target;if(!form.matches('[data-support-form],[data-review-form]'))return;e.preventDefault();
 const id=authUser?.id;if(!id)return;const button=form.querySelector('[type=submit]'),status=form.querySelector('[data-form-status]');if(button.disabled)return;
 button.disabled=true;status.textContent='Enviando…';const fields=new FormData(form),isSupport=form.hasAttribute('data-support-form');
 try{const result=await portalApi(isSupport?'ticket':'review',isSupport?{category:fields.get('category'),message:fields.get('message')}:{rating:Number(fields.get('rating')),comment:fields.get('comment')});if(authUser?.id!==id)return;status.textContent=isSupport?'Pedido enviado. Protocolo '+result.id.slice(0,8).toUpperCase()+'. A equipe poderá responder pelo e-mail da sua conta.':'Avaliação salva. Obrigado por ajudar o Rumo a melhorar!';form.reset();}
 catch(error){if(authUser?.id===id)status.textContent=error.message;}
 finally{button.disabled=false;}
});

setInterval(async()=>{if(view!=='checkout'||busy||!authUser||!license?.order||license.order.status!=='reported')return;try{await loadLicense();if(view==='checkout')render();}catch{}},30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen)closeMenu();});
async function initStorefront(){render();try{const d=await authCall('session');authUser=d.user;await loadLicense();if(new URLSearchParams(location.search).has('comprar'))navigate('checkout');else if(new URLSearchParams(location.search).has('entrar'))showAuth();else render();}catch{if(new URLSearchParams(location.search).has('entrar')||new URLSearchParams(location.search).has('comprar'))showAuth();}}
void initStorefront();
})();
