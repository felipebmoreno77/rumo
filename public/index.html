let answers=Array(questions.length).fill(null),step=0,view='home',previous='question',menuOpen=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const complete=()=>answers.every(x=>x!==null);
function getProfile(values=answers){
 const scores=Object.fromEntries(Object.keys(routes).map(k=>[k,0])),evidence=Object.fromEntries(Object.keys(routes).map(k=>[k,[]]));
 questions.forEach((q,i)=>{if(q.context)return;const o=q.options[values[i]];if(!o)return;for(const [k,n] of Object.entries(o.signals)){scores[k]+=n;evidence[k].push({i,weight:n,text:o.note})}});
 const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
 const top=ranked[0],second=ranked[1],enough=evidence[top].length>=3;
 const clear=enough&&scores[top]-scores[second]>=3;
 return {scores,evidence,ranked,top,second,enough,clear};
}

function reflection(){
 if(step<3)return '';
 if(answers[1]===0&&answers[2]===0)return 'Você sinalizou querer autonomia e também um exemplo para começar. Essas necessidades podem coexistir: apoio inicial e mais liberdade com o tempo.';
 if(step>=6&&answers[0]===0&&answers[4]===2)return 'Você destacou autoria e liberdade para criar. Agora vamos olhar também para o apoio de que precisa para manter essa rotina.';
 if(step>=6&&answers[2]===1&&answers[5]===1)return 'Você gosta da ideia de testar por conta própria e valoriza renda previsível em paralelo. Um projeto e uma base estável podem andar juntos.';
 if(step>=4&&answers[0]===2&&answers[3]===2)return 'Você citou tirar ideias do papel e organizar uma equipe. Vamos distinguir o interesse em liderar da vontade de cuidar também de clientes e de uma operação.';
 return '';
}
function aside(){const done=answers.map((v,i)=>({v,i})).filter(x=>x.v!==null&&x.v>=0&&x.i<8);const recent=done.slice(-2);return `<aside class="rp-aside"><small>Uma conversa sobre o seu momento</small><h3>${recent.length?'O que você já contou':'Aqui vale seu jeito real.'}</h3>${recent.length?`<ul>${recent.map(({v,i})=>`<li>${esc(questions[i].options[v].note)}</li>`).join('')}</ul>`:'<p>Não precisa parecer mais criativo, independente ou decidido. Escolha o que se aproxima do que você vive.</p>'}${reflection()?`<div class="rp-reflection"><small>Juntando suas respostas</small><p>${reflection()}</p></div>`:''}<div class="rp-reflection"><p>Preferências são pistas. Elas não medem talento nem dizem o que você consegue aprender.</p></div></aside>`}
function questionView(){const q=questions[step],a=answers[step];return `<button class="rp-home-back" data-act="home"><span aria-hidden="true">←</span> Voltar ao início</button><div class="rp-layout"><section><div class="rp-step-meta"><span>CONHECER SEU JEITO</span><span class="rp-count">${step+1} de ${questions.length}</span></div><div class="rp-track" role="progressbar" aria-label="Posição no questionário" aria-valuenow="${step+1}" aria-valuemin="0" aria-valuemax="${questions.length}"><span style="width:${(step+1)/questions.length*100}%"></span></div>${interestFocus?`<p class="rp-theme-note">Tema escolhido: ${esc(interestFocus)}. Agora vamos explorar como você gosta de trabalhar.</p>`:''}<span class="rp-overline">${q.topic}</span><h1>${q.title}</h1><p>${q.hint}</p><div class="rp-options" role="group" aria-label="${esc(q.title)}">${q.options.map((o,i)=>`<button class="rp-choice" data-option="${i}" aria-pressed="${a===i}"><span class="rp-choice-mark" aria-hidden="true">${a===i?'✓':''}</span><span>${o.text}</span></button>`).join('')}</div><button class="rp-skip" data-option="-1" aria-pressed="${a===-1}">${a===-1?'✓ ':''}Ainda não sei / nenhuma opção me representa</button><div class="rp-actions"><button class="rp-button rp-quiet" data-act="back" ${step===0?'disabled':''}>← Voltar</button><span style="font-size:12px;color:var(--rp-muted)">Uma opção · pode mudar depois</span><button class="rp-button" data-act="next" ${a===null?'disabled':''}>${step===9?'Ver minhas rotas':'Continuar'} →</button></div></section>${aside()}</div>`}
function overviewView(){return `<span class="rp-overline">A proposta completa</span><h1>Curto para responder.<br>Com espaço para pensar.</h1><p>Dez perguntas sobre situações e escolhas. Abra cada uma para ver as opções ou retome sua exploração.</p><button class="rp-button rp-secondary" data-act="question">${answers.some(v=>v!==null)?'Continuar minhas respostas':'Responder à primeira pergunta'} →</button><div class="rp-questions">${questions.map((q,i)=>`<details><summary><span class="rp-q-number">${String(i+1).padStart(2,'0')}</span>${q.title}</summary><p>${q.hint}</p><ul>${q.options.map((o,j)=>`<li>${esc(o.text)}${answers[i]===j?' <span style="color:var(--rp-lime)">← sua escolha</span>':''}</li>`).join('')}<li>Ainda não sei / nenhuma opção me representa.</li></ul><button class="rp-button rp-quiet rp-q-edit" data-jump="${i}">${answers[i]===null?'Responder':'Rever resposta'}</button></details>`).join('')}</div><details class="rp-transparency"><summary>O que esta proposta analisa?</summary><p>Motivação, autonomia, estrutura, relação com criação e público, apoio diante de incerteza e condições atuais. As perguntas são originais desta proposta, não itens de um teste psicológico validado. As respostas sobre interesses aproximam áreas; apoio, organização e condições atuais ajudam a adaptar a experiência.</p></details>`}
function baseContextText(values=answers){switch(values[8]){case 0:return 'Você precisa de renda previsível logo. Por isso, o plano começa por conhecer opções com uma base de renda e testar sua rota de interesse em paralelo, sem depender de retorno do experimento. Essa condição não define seu potencial.';case 1:return 'Você pode experimentar em paralelo ao estudo ou trabalho. Comece com um projeto pequeno e um limite de tempo que preserve seus compromissos.';case 2:return 'Você indicou tempo e apoio para testar sem contar com retorno. Combine um limite de tempo e recursos e observe a experiência antes de assumir compromissos maiores.';default:return 'Antes de ampliar um projeto, vale esclarecer seu tempo, recursos e necessidade de renda. O primeiro teste pode ser pequeno e sem compras.'}}
function comboText(p){const keys=[p.top,p.second];if(!p.enough)return 'Ainda faltam sinais repetidos. Experimente uma tarefa de cada rota antes de preferir uma delas.';if(keys.includes('creative')&&keys.includes('enterprise'))return 'Criação e projeto próprio podem se encontrar num negócio criativo. Também é possível testar autoria e atendimento a um público sem depender disso para ter renda.';if(keys.includes('creative')&&keys.includes('team'))return 'Você pode conhecer uma equipe criativa ou um trabalho com espaço para autoria. Fazer arte e ter um emprego são possibilidades que podem andar juntas.';return 'Aprender numa equipe e experimentar uma ideia própria em paralelo pode ajudar a comparar as duas rotinas, sem precisar escolher tudo agora.'}

function originalResultView(){if(!complete()){const missing=answers.filter(x=>x===null).length;return `<h1>Vamos completar seu mapa.</h1><p>${missing===1?'Falta 1 pergunta':'Faltam '+missing+' perguntas'} para comparar suas rotas. Você pode escolher uma opção ou marcar “Ainda não sei”. Suas respostas anteriores continuam aqui.</p><button class="rp-button" data-act="question">Ir à primeira pergunta pendente →</button>`;}const p=getProfile();const first=p.clear?routes[p.top].title:p.enough?'Mais de uma rota merece um teste':'Ainda faltam pistas para destacar uma rota';return `<span class="rp-overline">Seu mapa de formas de trabalhar</span><h1>${first}</h1><p>${p.clear?'Esta rota reuniu mais sinais nas suas respostas. Ela é um primeiro experimento possível, não uma previsão sobre onde você vai se sair melhor.':p.enough?'Suas respostas apontam para interesses que podem coexistir. O mapa não força uma escolha quando os sinais estão próximos.':'As opções abaixo servem como exemplos para explorar. Com poucas respostas, a ordem não deve ser lida como preferência sua.'}</p>${interestFocus?`<p class="rp-theme-note">Use o tema ${esc(interestFocus)} nos projetos e tarefas quando fizer sentido. Ele não decide sozinho sua rota.</p>`:''}<div class="rp-route-grid">${p.ranked.map((k,index)=>{const r=routes[k],ev=p.evidence[k].slice().sort((a,b)=>b.weight-a.weight).slice(0,3);return `<article class="rp-route ${p.clear&&index===0?'rp-highlight':''}"><span class="rp-tag">${p.clear&&index===0?'Primeira rota para testar':ev.length>=3?'Sinais presentes em várias respostas':ev.length?'Pistas iniciais':'Ainda sem sinais seus'}</span><h2>${r.title}</h2><p>${r.desc}</p><span class="rp-label">O que nas suas respostas aponta para isso</span>${ev.length?`<ul class="rp-evidence">${ev.map(e=>`<li>${esc(e.text)}</li>`).join('')}</ul>`:'<p>Não temos respostas suas que apoiem esta rota por enquanto.</p>'}<span class="rp-label">O que falta descobrir</span><p>${r.watch}</p><span class="rp-label">Um teste pequeno</span><p>${r.test}</p><div class="rp-route-bottom"><span class="rp-plan-caption">Rotina sugerida · primeiros 7 dias</span><button class="rp-button rp-secondary" data-up-route="${k}">Conhecer esse caminho ↗</button><button class="rp-button rp-secondary" data-route="${k}">Ver rotina e plano →</button></div></article>`}).join('')}</div><div class="rp-summary"><h3>Uma combinação que vale comparar</h3><p>${comboText(p)}</p></div><div class="rp-context"><h3>Seu momento muda o plano, não seu valor.</h3><p>${contextText()}</p><span class="rp-label">Seu teste escolhido</span><p>${chosenTests[answers[9]]||'Você ainda não escolheu. Experimente uma das propostas dos cartões, sem compromisso com uma carreira.'}</p></div><p style="margin-top:20px">Arte é uma área de atuação. Emprego e empreendedorismo são formas de trabalhar. Você pode ser artista contratado, autônomo ou ter um negócio criativo.</p><details class="rp-transparency"><summary>Como chegamos a este mapa?</summary><p>Regras editoriais somam pistas das oito primeiras respostas e procuram sinais repetidos. A ordem não é uma nota de aptidão, chance de sucesso ou diagnóstico. Preferências por apoio e estrutura não impedem criar um negócio; gostar de autonomia não prova preparo para empreender. Empates são apresentados sem uma rota vencedora.</p><p>As perguntas foram escritas para esta proposta, inspiradas na distinção entre interesses, valores e estilos de trabalho. O questionário não foi validado como instrumento psicológico. Resultados precisam ser confrontados com experiências e, quando útil, orientação profissional.</p><div class="rp-source-links"><a href="https://www.onetcenter.org/content.html" target="_blank" rel="noopener noreferrer">O*NET · interesses e estilos</a><a href="https://capd.mit.edu/channels/self-assessments/" target="_blank" rel="noopener noreferrer">MIT · autorreflexão e carreira</a></div></details><div class="rp-actions"><button class="rp-button rp-secondary" data-act="question">← Rever minhas respostas</button><button class="rp-button rp-quiet" data-act="restart">Recomeçar jornada</button></div>`}

function baseRoutineTiming(){const smaller=routineState[activeRoute].feedback.saved&&routineState[activeRoute].feedback.next==='smaller';return smaller||answers[8]===0?{prepare:3,practice:10,reflect:2,total:15}:answers[8]===2?{prepare:5,practice:20,reflect:5,total:30}:{prepare:3,practice:12,reflect:5,total:20}}
function routinesView(){return `<section class="up-page"><button type="button" class="rp-home-back" data-act="home"><span aria-hidden="true">←</span> Voltar ao início</button><span class="rp-overline">7 experiências por caminho</span><h1>Cada área,<br><em>uma semana diferente.</em></h1><p>Escolha uma área para ver seus sete testes específicos. O mesmo plano é usado quando você chega pelo questionário.</p><div class="up-path-grid">${Object.entries(routes).map(([k,r])=>`<article class="up-box"><h2>${r.title}</h2><ol class="ex-route-list">${experimentalWeeks[k].map(([title])=>`<li>${title}</li>`).join('')}</ol><button class="rp-button rp-secondary" data-route="${k}">Abrir estes 7 passos →</button><button class="rp-link" data-up-route="${k}">Ver detalhes das experiências ↗</button></article>`).join('')}</div></section>`}
function taskResponseField(k,i){const d=routineState[k].days[i];return `<section class="rp-task-record"><label for="rp-task-response-${k}-${i}">Seu registro da tarefa <span>(opcional)</span></label><p id="rp-task-help-${k}-${i}">Escreva suas respostas, ideias, rascunhos ou o resultado do que a tarefa pediu. Pode começar pequeno e completar depois.</p><textarea id="rp-task-response-${k}-${i}" data-day-task-response="${i}" maxlength="6000" rows="6" aria-describedby="rp-task-help-${k}-${i}" placeholder="O que a tarefa pediu para você criar, responder ou testar? Registre aqui…">${esc(d.taskResponse||'')}</textarea></section>`}
function routineView(){const k=activeRoute,p=getPlan(k),r=routes[k],rs=routineState[k],limit=rs.extended?14:7,count=routineCount(k,limit),weekOne=routineCount(k,7),timing=routineTiming();return `<div class="rp-plan-toolbar"><button class="rp-link" data-act="routines">← Comparar rotinas</button>${complete()?'<button class="rp-link" data-act="results">Voltar ao meu mapa</button>':''}</div><span class="rp-overline">${r.title}</span><h1>Sua rotina para experimentar.</h1><p>${p.intro} Ajuste os horários à sua vida; não precisa fazer tudo em dias seguidos.</p><section class="rp-rhythm"><div><span class="rp-plan-caption">UM BLOCO POR DIA</span><h2>${timing.total} minutos como ponto de partida</h2><p>${answers[8]===0?'Você indicou precisar de renda agora. Esta é uma exploração curta, que pode acontecer em paralelo à busca por uma base de renda.':answers[8]===2?'Você indicou ter tempo para testar. Comece pequeno e aumente apenas se fizer sentido para você.':'Comece com um bloco curto, junto dos seus outros compromissos.'}</p></div><ol class="rp-rhythm-parts"><li><span>${timing.prepare} min</span><div><strong>Preparar</strong><small>Escolher a tarefa de hoje.</small></div></li><li><span>${timing.practice} min</span><div><strong>Experimentar</strong><small>Fazer uma versão pequena.</small></div></li><li><span>${timing.reflect} min</span><div><strong>Registrar</strong><small>Anotar como foi para você.</small></div></li></ol></section><div class="rp-plan-grid"><section><div class="rp-plan-heading"><div><span class="rp-overline">${rs.extended?'Continue até 14 dias':'Seus primeiros 7 dias'}</span><h2>Um passo por dia.</h2></div><span class="rp-plan-caption">${count} de ${limit} registros</span></div><div class="rp-track" role="progressbar" aria-label="Dias registrados" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${limit}"><span style="width:${count/limit*100}%"></span></div><div class="rp-plan-days">${p.days.slice(0,limit).map(([title,task],i)=>{const d=rs.days[i];return `<details class="rp-plan-day" data-plan-day="${i}" ${rs.openDay===i?'open':''}><summary><span class="rp-day-number ${d.registered?'rp-day-done':''}" aria-label="${d.registered?'Dia registrado':'Dia ainda sem registro'}">${d.registered?'✓':String(i+1).padStart(2,'0')}</span><span><small>Dia ${i+1}${i>6?' · continuação':''}</small><strong>${esc(title)}</strong></span><span class="rp-day-plus" aria-hidden="true">+</span></summary><div class="rp-day-body"><p>${esc(task)}</p>${taskResponseField(k,i)}<div class="rp-mood-label">Como foi a tarefa de hoje para você?</div><p class="rp-checkin-help">Escolha como foi ou use “Outra resposta” para escrever do seu jeito. Depois, registre o dia.</p><details class="rp-select-menu"><summary id="rp-mood-${k}-${i}" aria-label="Como foi o dia ${i+1}: ${d.mood?moodLabels[d.mood]:'escolha uma opção'}"><span class="rp-select-value">${d.mood?moodLabels[d.mood]:'Escolha uma opção'}</span><span class="rp-select-chevron" aria-hidden="true">⌄</span></summary><fieldset class="rp-dropdown-options"><legend class="rp-dropdown-legend">Como foi o dia ${i+1}?</legend>${Object.entries(moodLabels).map(([v,t])=>`<button type="button" class="rp-dropdown-option" data-mood-choice="${i}" data-mood-value="${v}" aria-pressed="${d.mood===v}">${t}</button>`).join('')}</fieldset></details><label for="rp-note-${k}-${i}">${d.mood==='other'?'Sua resposta, com suas palavras':'O que você percebeu? <span>(opcional)</span>'}</label><textarea id="rp-note-${k}-${i}" data-day-note="${i}" maxlength="2000" aria-required="${d.mood==='other'}" placeholder="${d.mood==='other'?'Ex.: Gostei de começar, mas precisei de ajuda para terminar.':'Uma frase já ajuda…'}">${esc(d.note)}</textarea><div class="rp-day-save"><button class="rp-button rp-secondary" data-register-day="${i}" ${!d.mood||(d.mood==='other'&&!d.note.trim())?'disabled':''}>${d.registered?'Atualizar registro':'Registrar este dia'}</button>${d.registered?'<span class="rp-recorded">Registro feito ✓</span>':''}</div>${d.registered?'<div class="ry-record-actions"><button class="rp-link" data-y-action="new-creation">Guardar algo que criei ↗</button><button class="rp-link" data-y-nav="achievements">Minhas conquistas</button></div>':''}</div></details>`}).join('')}</div></section><aside class="rp-plan-side"><div class="rp-continuation"><span class="rp-overline">Depois dos primeiros 7 dias</span><h3>${rs.passAccess?'Sua continuação está liberada.':'Abra seu Passaporte da jornada.'}</h3><p>${rs.passAccess?'Os dias 8 a 14 estão no plano. Seu feedback e o histórico da primeira semana ficam no Passaporte.':weekOne===7?'Conte como foi a semana, veja seus registros e conheça a continuação opcional.':'Complete os sete registros para abrir seu feedback da semana e conhecer os próximos passos.'}</p><button class="rp-button ${weekOne<7?'rp-quiet':''}" data-act="passport" ${weekOne<7?'disabled':''}>${weekOne<7?'Concluir 7 registros':'Abrir meu Passaporte →'}</button><small>${weekOne} de 7 registros da primeira semana</small></div><div class="rp-plan-reminder"><h3>O objetivo é descobrir, não acertar tudo.</h3><p>Mesmo se não conseguiu fazer a tarefa, registre como foi. Uma dificuldade também ajuda a ajustar o próximo passo.</p><p>Você pode testar outra rota sem apagar os registros desta.</p></div><div class="rp-plan-reminder"><h3>Seu progresso está com você</h3><p>Os registros ficam salvos neste navegador e dispositivo. Você pode voltar depois. Limpar os dados do navegador pode apagar sua jornada.</p></div></aside></div>${rs.extended&&count===14?'<div class="rp-summary"><h3>Você registrou duas semanas de experiências.</h3><p>Releia o que deu energia e o que não fez sentido. Escolha entre aprofundar uma habilidade, ajustar a rotina ou comparar outra rota. Continuar é uma escolha sua.</p></div>':''}`}
function openRoutine(k){if(!Object.hasOwn(routes,k))return;routeChosen=true;activeRoute=k;navigate('routine')}
function registerRoutineDay(i){const rs=routineState[activeRoute],limit=rs.extended?14:7;if(!Number.isInteger(i)||i<0||i>=limit||!rs.days[i].mood||(rs.days[i].mood==='other'&&!rs.days[i].note.trim()))return;if(!rs.days[i].taskSnapshot)rs.days[i].taskSnapshot=getPlan(activeRoute).days[i].slice();rs.days[i].registered=true;recordPortalEvent('task_record',{route:activeRoute,day:i+1,value:rs.days[i].mood});const next=rs.days.findIndex((d,j)=>j<limit&&!d.registered);rs.openDay=next>=0?next:i;render();live.textContent=routineCount(activeRoute,7)===7&&!rs.extended?'Sete dias registrados. Abra o Passaporte para refletir sobre a semana e conhecer a continuação.':'Dia '+(i+1)+' registrado.'}
function selectRoutineMood(i,value){
 const rs=routineState[activeRoute],limit=rs.extended?14:7;
 if(!Number.isInteger(i)||i<0||i>=limit||!Object.hasOwn(moodLabels,value))return;
 rs.days[i].mood=value;rs.openDay=i;
 if(value==='other'&&!rs.days[i].note.trim())rs.days[i].registered=false;
 render();
 const target=root.querySelector(value==='other'?'[data-day-note="'+i+'"]':'#rp-mood-'+activeRoute+'-'+i);
 if(target)target.focus({preventScroll:true});
 live.textContent=value==='other'?'Escreva sua resposta para registrar este dia.':'Opção escolhida: '+moodLabels[value];
}
root.addEventListener('input',event=>{
 if(event.target.dataset.dayTaskResponse!==undefined){
  const i=Number(event.target.dataset.dayTaskResponse),rs=routineState[activeRoute],limit=rs.extended?14:7;
  if(Number.isInteger(i)&&i>=0&&i<limit)rs.days[i].taskResponse=event.target.value.slice(0,6000);
  return;
 }
 if(event.target.dataset.dayNote===undefined)return;
 const i=Number(event.target.dataset.dayNote),rs=routineState[activeRoute],d=rs.days[i];
 if(!d)return;d.note=event.target.value.slice(0,2000);
 if(d.mood==='other'&&!d.note.trim()&&d.registered){d.registered=false;rs.openDay=i;render();root.querySelector('[data-day-note="'+i+'"]')?.focus({preventScroll:true})}
 const button=root.querySelector('[data-register-day="'+i+'"]');
 if(button)button.disabled=!d.mood||(d.mood==='other'&&!d.note.trim());
});

k-field="next" data-feedback-value="${v}" aria-pressed="${f.next===v}">${t}</button>`).join('')}</div></div><div class="rp-actions"><button class="rp-button" data-act="save-feedback" ${!f.feeling||!f.next?'disabled':''}>${f.saved?'Atualizar meu feedback':'Guardar no meu Passaporte'} →</button>${f.saved?'<span class="rp-recorded">Feedback registrado ✓</span>':''}</div></div>${f.saved?`<div class="rp-summary"><h3>Seu próximo passo, por enquanto</h3><p>${feedbackAdvice(f)}</p>${f.next==='compare'||f.feeling==='change'?'<button class="rp-link" data-act="routines">Comparar as outras rotinas →</button>':''}</div>`:''}<section class="rp-pass-history"><h2>O que você já viveu nesta rota.</h2><p>Os registros da primeira semana continuam acessíveis. A continuação é opcional.</p>${rs.days.slice(0,7).map((d,i)=>`<details><summary>Dia ${i+1} · ${esc(getPlan(activeRoute).days[i][0])}</summary>${d.taskResponse?`<div class="rp-task-saved"><strong>Seu registro da tarefa</strong><p>${esc(d.taskResponse)}</p></div>`:''}<p><strong>Como foi:</strong> ${esc(d.mood==='other'?d.note:moodLabels[d.mood])}</p>${d.note&&d.mood!=='other'?`<p>${esc(d.note)}</p>`:''}</details>`).join('')}</section></section><aside><div class="rp-pass-offer"><span class="rp-overline">Próximo capítulo</span><h2>${rs.passAccess?'Sua continuação está liberada.':'Passaporte de continuação'}</h2><p>${rs.passAccess?'Volte ao plano para ver os dias 8 a 14 e continuar registrando as descobertas.':'Continue do dia 8 ao 14 com novas tarefas e um ritmo ajustado ao seu feedback.'}</p><ul><li>Dias 8 a 14 da rota escolhida.</li><li>Registros e reflexão ao final.</li><li>Opção de adaptar o ritmo ou comparar rotas.</li></ul>${rs.passAccess?'<button class="rp-button" data-act="continue-plan">Abrir dias 8 a 14 →</button>':`<span class="rp-pass-paid">Novas experiências · dias 8 a 14</span><button class="rp-button" data-act="review-passport" ${!f.saved?'disabled':''}>Conhecer a continuação →</button><small>${f.saved?'Veja o que inclui  const tests=Object.keys(routineState).filter(k=>routineCount(k,14)>0).length;
 const compared=Object.values(youth.comparisons).some(pair=>Object.values(pair.entries).filter(e=>e.tried).length===2);
 const earned={finish:youth.creations.some(c=>c.status==='done'),feedback:youth.creations.some(c=>c.feedbackRequested),explore:tests>=2||compared};
 for(const badge of youthBadges)if(earned[badge.id]&&!youth.earned.includes(badge.id))youth.earned.push(badge.id);
}
function currentComparison(){
 if(youth.compareSelection.length!==2)return null;
 const key=youth.compareSelection.slice().sort().join('|');
 if(!youth.comparisons[key])youth.comparisons[key]={topic:youth.topic,entries:Object.fromEntries(youth.compareSelection.map(k=>[k,{energy:'',repeat:'',note:'',tried:false}]))};
 return youth.comparisons[key];
}

const repeatLabels={yes:'Quero repetir',maybe:'Talvez, com ajustes',no:'Prefiro outro teste'};

 return [`Escolha um resultado pequeno${project?' para “'+project.title+'”':''} e defina o que vai deixar para depois.`,`Divida o trabalho em três etapas e separe um momento curto para a primeira tentativa.`,`Guarde uma versão em Minhas criações e decida se quer pedir uma opinião antes de revisar.`];
}

function compareView(){const pair=currentComparison(),keys=youth.compareSelection;return `<section class="ry-page">${youthNotice()}<span class="rp-overline">Comparar dois caminhos</span><h1>Na dúvida entre dois?<br><em>Experimente os dois.</em></h1><p>Escolha dois caminhos, faça uma tentativa curta em cada um e compare sua experiência. Não precisa decidir uma profissão.</p><div class="ry-compare-picker" role="group" aria-label="Escolha dois caminhos">${Object.entries(routes).map(([k,r])=>`<button data-y-compare-route="${k}" aria-pressed="${keys.includes(k)}" ${keys.length===2&&!keys.includes(k)?'disabled':''}>${keys.includes(k)?'<span aria-hidden="true">✓</span>':''}${r.title}</button>`).join('')}</div><p class="ry-fine">${keys.length} de 2 escolhidos. Para trocar, desmarque um caminho.</p>${pair?`<div class="ry-compare-grid">${keys.map(k=>{const e=pair.entries[k];return `<article class="ry-test"><span class="rp-overline">Um teste de cerca de 10 minutos</span><h2>${routes[k].title}</h2><p>${comparisonTask(k,pair.topic)}</p><fieldset><legend>O que você sentiu ao experimentar?</legend>${Object.entries(energyLabels).map(([v,t])=>`<button data-y-compare-field="energy" data-y-compare-route-key="${k}" data-y-value="${v}" aria-pressed="${e.energy===v}">${t}</button>`).join('')}</fieldset><label for="ry-compare-note-${k}">O que foi fácil ou cansou? <span>(opcional)</span></label><textarea id="ry-compare-note-${k}" data-y-compare-note="${k}" maxlength="1000" placeholder="Uma frase sobre a experiência…">${esc(e.note)}</textarea><fieldset><legend>Você toparia repetir?</legend>${Object.entries(repeatLabels).map(([v,t])=>`<button data-y-compare-field="repeat" data-y-compare-route-key="${k}" data-y-value="${v}" aria-pressed="${e.repeat===v}">${t}</button>`).join('')}</fieldset><button class="rp-button rp-secondary" data-y-compare-save="${k}" ${!e.energy||!e.repeat?'disabled':''}>${e.tried?'Teste registrado ✓':'Registrar meu teste'}</button></article>`}).join('')}</div>${keys.every(k=>pair.entries[k].tried)?`<section class="ry-compare-result"><span class="rp-overline">Suas experiências lado a lado</span><h2>O que você gostaria de repetir?</h2><div class="ry-compare-summary">${keys.map(k=>{const e=pair.entries[k];return `<div><h3>${routes[k].title}</h3><p>${energyLabels[e.energy]}.</p><strong>${repeatLabels[e.repeat]}.</strong>${e.note?`<p>${esc(e.note)}</p>`:''}<button class="rp-button" data-y-adopt="${k}">Continuar por aqui ↗</button></div>`}).join('')}</div><p>Esse foi um teste curto. Você pode mudar de ideia e testar outra tarefa antes de escolher.</p></section>`:''}`:'<div class="ry-empty"><i data-lucide="git-compare-arrows" aria-hidden="true"></i><h2>Dois testes. Mais pistas para você.</h2><p>Depois de escolher os caminhos, as tarefas aparecem aqui.</p></div>'}</section>`}

root.addEventListener('click',async event=>{
 const b=event.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.yNav){if(b.dataset.yNav==='next'&&!canAccessNext()){live.textContent=nextLockedMessage();return}if(['projects','creations','compare','next','achievements'].includes(b.dataset.yNav)){youth.message='';navigate(b.dataset.yNav)}return}
 if(b.dataset.yTopicOpen){if(Object.hasOwn(youthTopics,b.dataset.yTopicOpen)){youth.topic=b.dataset.yTopicOpen;navigate('projects')}return}
 if(b.dataset.yTopic){if(Object.hasOwn(youthTopics,b.dataset.yTopic)){youth.topic=b.dataset.yTopic;render()}return}
 if(b.dataset.yProjectRoute){if(Object.hasOwn(routes,b.dataset.yProjectRoute)){youth.projectRoute=b.dataset.yProjectRoute;render()}return}
 if(b.dataset.yStatus){if(youth.editor&&['draft','done'].includes(b.dataset.yStatus)){youth.editor.status=b.dataset.yStatus;render()}return}
 if(b.dataset.yEdit){const entry=youth.creations.find(c=>c.id===b.dataset.yEdit);if(entry)creationDraft(entry);return}
 if(b.dataset.yFeedback){const entry=youth.creations.find(c=>c.id===b.dataset.yFeedback);if(entry){entry.feedbackRequested=!entry.feedbackRequested;render()}return}
 if(b.dataset.yShare){youth.shareId=youth.shareId===b.dataset.yShare?null:b.dataset.yShare;render();return}
 if(b.dataset.yDelete){
  const id=b.dataset.yDelete;
  if(youth.deleteId===id){youth.creations=youth.creations.filter(c=>c.id!==id);youth.deleteId=null;youth.message='Criação removida desta prévia.'}else youth.deleteId=id;
  render();return;
 }
 if(b.dataset.yCopy){
  const entry=youth.creations.find(c=>c.id===b.dataset.yCopy);if(!entry)return;
  try{if(!globalThis.navigator?.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(youthShareText(entry));youth.message='Resumo copiado. Você decide onde compartilhar.'}
  catch{youth.message='Selecione o resumo e use a opção Copiar do seu dispositivo.'}
  render();return;
 }
 if(b.dataset.yCompareRoute){
  const k=b.dataset.yCompareRoute;if(!Object.hasOwn(routes,k))return;
  if(youth.compareSelection.includes(k))youth.compareSelection=youth.compareSelection.filter(v=>v!==k);else if(youth.compareSelection.length<2)youth.compareSelection.push(k);
  render();return;
 }
 if(b.dataset.yCompareField){
  const pair=currentComparison(),field=b.dataset.yCompareField,k=b.dataset.yCompareRouteKey,value=b.dataset.yValue;
  if(pair?.entries[k]&&((field==='energy'&&Object.hasOwn(energyLabels,value))||(field==='repeat'&&Object.hasOwn(repeatLabels,value)))){pair.entries[k][field]=value;pair.entries[k].tried=false;render()}
  return;
 }
 if(b.dataset.yCompareSave){
  const entry=currentComparison()?.entries[b.dataset.yCompareSave];if(entry?.energy&&entry?.repeat){entry.tried=true;render();live.textContent='Experiência registrada na comparação.'}return;
 }
 if(b.dataset.yAdopt){
  const k=b.dataset.yAdopt;if(!currentComparison()?.entries[k]?.tried)return;
  activeRoute=k;routeChosen=true;youth.projectRoute=k;
  if(!projectFor(k)){const pair=currentComparison();youth.projects[k]={...proposedProject(k,pair.topic),id:'project-'+youth.counter++}}
  interestFocus=youthTopics[projectFor(k).topic].label;navigate(complete()?'home':'routine');return;
 }
 if(b.dataset.yGoal){if(canAccessNext()&&Object.hasOwn(nextGoals,b.dataset.yGoal)){nextState().goal=b.dataset.yGoal;render()}return}
 switch(b.dataset.yAction){
  case'start-project':startYouthProject();break;
  case'new-creation':creationDraft();break;
  case'cancel-editor':youth.editor=null;render();break;
  case'save-creation':saveCreation();break;
  case'remove-image':if(youth.editor){youth.editor.image='';render()}break;
  case'dismiss':youth.message='';render();break;

const newDuoQuiz=()=>({step:0,page:'questions',answers:{a:Array(10).fill(null),b:Array(10).fill(null)},roleChoices:{a:null,b:null},routeChoice:null,applied:false});
function duoQuizState(){return duoState().quiz??=newDuoQuiz()}
function duoQuizComplete(q=duoQuizState()){return ['a','b'].every(p=>q.answers[p].every((v,i)=>Number.isInteger(v)&&v>=-1&&v<duoQuestions[i].options.length))}
function duoQuizProfile(person){
 const q=duoQuizState(),routeScores=Object.fromEntries(Object.keys(routes).map(k=>[k,0])),roleKeys=[];
 [0,7].forEach(i=>{const option=duoQuestions[i].options[q.answers[person][i]];for(const [k,v] of Object.entries(option?.routes||{}))routeScores[k]+=v});
 [1,3].forEach(i=>{const role=duoQuestions[i].options[q.answers[person][i]]?.role;if(role&&!roleKeys.includes(role))roleKeys.push(role)});
 return {routeScores,roleKeys};
}
function duoSharedPaths(){
 const a=duoQuizProfile('a'),b=duoQuizProfile('b');
 return Object.keys(routes).filter(k=>a.routeScores[k]>0&&b.routeScores[k]>0).sort((x,y)=>Math.min(a.routeScores[y],b.routeScores[y])-Math.min(a.routeScores[x],b.routeScores[x])||a.routeScores[y]+b.routeScores[y]-a.routeScores[x]-b.routeScores[x]);
}
function duoAnswer(person,i){const value=duoQuizState().answers[person][i];return value===-1?'Ainda não sei':duoQuestions[i].options[value]?.text||'Ainda sem resposta'}
function initializeDuoSuggestions(){const q=duoQuizState();for(const p of ['a','b']){const keys=duoQuizProfile(p).roleKeys;if(!q.roleChoices[p]&&keys.length===1)q.roleChoices[p]=keys[0]}}
function duoQuizCanApply(){const q=duoQuizState();return duoQuizComplete()&&Object.hasOwn(routes,q.routeChoice)&&['a','b'].every(p=>Object.hasOwn(duoRoles,q.roleChoices[p]))}
function duoTimeSuggestion(){
 const q=duoQuizState(),a=duoQuestions[9].options[q.answers.a[9]]?.minutes,b=duoQuestions[9].options[q.answers.b[9]]?.minutes;
 return a&&b?`Como primeira tentativa, vocês podem começar pelo bloco mais curto informado: ${Math.min(a,b)} minutos. Ajustem esse combinado juntos.`:'Combinem o tempo antes de começar. As respostas de vocês podem pedir encontros curtos, partes separadas ou outro acordo.';
}
function cleanDuoQuiz(value){
 const clean=newDuoQuiz();if(!value||typeof value!=='object')return clean;
 clean.step=Number.isInteger(value.step)?Math.max(0,Math.min(9,value.step)):0;
 for(const p of ['a','b']){clean.answers[p]=Array.from({length:10},(_,i)=>{const v=value.answers?.[p]?.[i];return Number.isInteger(v)&&v>=-1&&v<5?v:null});clean.roleChoices[p]=Object.hasOwn(duoRoles,value.roleChoices?.[p])?value.roleChoices[p]:null}
 clean.routeChoice=Object.hasOwn(routes,value.routeChoice)?value.routeChoice:null;
 clean.page=['questions','overview','result','setup'].includes(value.page)?value.page:'questions';
 clean.applied=!!value.applied&&duoQuizComplete(clean)&&!!clean.routeChoice&&['a','b'].every(p=>!!clean.roleChoices[p]);
 if(!duoQuizComplete(clean)&&['result','setup'].includes(clean.page))clean.page='questions';
 return clean;
}

function duoQuizOverview(){const d=duoState(),q=duoQuizState(),readOnly=d.phase==='mission';return `<section class="ry-page"><span class="rp-overline">Questionário da dupla · visão completa</span><h1>Dez situações.<br><em>Dois pontos de vista.</em></h1><p>As perguntas falam da parceria, das tarefas e dos combinados. As respostas da jornada individual continuam separadas.</p><button class="rp-button rp-secondary" data-dq-action="${readOnly||duoQuizComplete()?'result':'resume'}">${readOnly||duoQuizComplete()?'Voltar ao ponto de partida da dupla':'Continuar nossas respostas'} →</button><div class="rp-questions">${duoQuestions.map((question,i)=>`<details><summary><span class="rp-q-number">${String(i+1).padStart(2,'0')}</span>${question.title}</summary><p>${question.hint}</p><ul>${question.options.map((option,j)=>`<li>${option.text}${['a','b'].filter(p=>q.answers[p][i]===j).map(p=>` <small class="dq-choice-name">${esc(duoName(p))}</small>`).join('')}</li>`).join('')}<li>Ainda não sei / nenhuma opção me representa.</li></ul>${!readOnly?`<button class="rp-button rp-quiet rp-q-edit" data-dq-jump="${i}">${['a','b'].every(p=>q.answers[p][i]!==null)?'Rever respostas':'Responder esta pergunta'}</button>`:''}</details>`).join('')}</div></section>`}
function duoQuizRoleChoice(person,readOnly){const q=duoQuizState(),profile=duoQuizProfile(person),selected=readOnly?duoState().roles[person]:q.roleChoices[person];return `<section class="dq-role-result"><h3>${esc(duoName(person))}</h3><p>${profile.roleKeys.length?'Nas respostas sobre começar e finalizar, você citou: '+profile.roleKeys.map(k=>duoRoles[k].title.toLowerCase()).join(' e ')+'.':'Você ainda não indicou um papel nessas respostas. Pode escolher um para experimentar.'}</p><div class="dq-role-chips" role="group" aria-label="Papel de ${esc(duoName(person))}">${Object.entries(duoRoles).map(([k,r])=>`<button data-dq-role-person="${person}" data-dq-role="${k}" aria-pressed="${selected===k}" ${readOnly?'disabled':''}>${r.title}</button>`).join('')}</div></section>`}
function duoQuizAgreements(readOnly){const items=[{title:'Como decidir juntos',index:2,tip:'Se as respostas forem diferentes, escolham um jeito de decidir que os dois aceitem.'},{title:'Como dividir o esforço',index:5,tip:'O combinado pode respeitar tempos diferentes sem deixar uma pessoa responsável por tudo.'},{title:'Como conversar sobre melhorias',index:6,tip:'Ao comentar o trabalho do outro, levem em conta como essa pessoa prefere receber retorno.'},{title:'O apoio que cada um precisa',index:8,tip:'A ajuda que você oferece nem sempre é a mesma que a outra pessoa quer receber.'}];return `<div class="dq-agreements">${items.map(item=>`<article><h3>${item.title}</h3>${['a','b'].map(p=>`<p><strong>${esc(duoName(p))}:</strong> ${duoAnswer(p,item.index)}</p>`).join('')}<small>${item.tip}</small>${!readOnly?`<button class="rp-link" data-dq-jump="${item.index}">Rever esse combinado →</button>`:''}</article>`).join('')}</div><details class="dq-support"><summary>O apoio que cada um costuma oferecer</summary>${['a','b'].map(p=>`<p><strong>${esc(duoName(p))}:</strong> ${duoAnswer(p,4)}</p>`).join('')}</details>`}
function duoQuizResult(){
 if(!duoQuizComplete())return duoQuizQuestionView();

 return `<section class="ry-page dq-result"><span class="rp-overline">O ponto de partida da dupla</span><h1>Dois jeitos de pensar.<br><em>Um começo para combinar.</em></h1><p>As respostas trazem preferências para uma primeira experiência. Vocês podem ajustar os papéis e mudar de ideia depois de testar.</p><section class="dq-result-section"><div class="ry-heading"><div><h2>${shared.length?'Onde há curiosidades dos dois':'Escolham uma curiosidade para testar'}</h2><p>${shared.length?'Estes caminhos apareceram nas respostas de interesse das duas pessoas. Eles não definem uma profissão.':'Ainda não apareceu um caminho com sinais dos dois. Vocês podem escolher uma ideia pequena ou experimentar duas áreas antes de decidir.'}</p></div>${!readOnly?'<button class="rp-link" data-dq-jump="0">Rever interesses</button>':''}</div><div class="dq-paths">${keys.map(k=>`<article class="${q.routeChoice===k?'dq-picked':''}"><span class="rp-overline">${shared.includes(k)?'Pistas das duas pessoas':'Uma possibilidade para explorar'}</span><h3>${routes[k].title}</h3><p>${routes[k].desc}</p><button class="rp-button rp-secondary" data-dq-route="${k}" ${readOnly?'disabled':''}>${q.routeChoice===k?'Caminho escolhido ✓':'Escolher este caminho'}</button></article>`).join('')}</div>${shared.length?`<details class="ry-route-picker"><summary>Vocês podem escolher outro caminho <span aria-hidden="true">⌄</span></summary><div class="ry-route-options">${Object.entries(routes).map(([k,r])=>`<button data-dq-route="${k}" aria-pressed="${q.routeChoice===k}" ${readOnly?'disabled':''}>${r.title}</button>`).join('')}</div></details>`:''}<p class="dq-selection">${q.routeChoice?'Caminho escolhido: '+routes[q.routeChoice].title:'Escolham um caminho para preparar a missão.'}</p></section><section class="dq-result-section"><h2>Papéis para a primeira tentativa.</h2><p>${q.roleChoices.a&&q.roleChoices.a===q.roleChoices.b?'Vocês se interessaram pelo mesmo papel. Podem fazer duas versões pequenas ou revezar entre as rodadas.':'Escolham o que cada um quer experimentar. Dois papéis diferentes são uma possibilidade, não uma obrigação.'}</p><div class="dq-role-results">${['a','b'].map(p=>duoQuizRoleChoice(p,readOnly)).join('')}</div></section><section class="dq-result-section"><h2>Antes de começar, combinem estas partes.</h2>${duoQuizAgreements(readOnly)}</section><section class="dq-time"><span class="rp-overline">O tamanho da primeira tentativa</span>${['a','b'].map(p=>`<p><strong>${esc(duoName(p))}:</strong> ${duoAnswer(p,9)}</p>`).join('')}<p>${duoTimeSuggestion()}</p></section><div class="dq-apply">${readOnly?'<button class="rp-button" data-dq-action="mission">Voltar para nossa missão →</button>':`<button class="rp-button" data-dq-action="apply" ${!duoQuizCanApply()?'disabled':''}>Preparar nossa missão →</button><small>${duoQuizCanApply()?'Vocês poderão escolher o tema e ajustar os papéis antes de começar.':'Escolham um caminho e um papel para cada pessoa.'}</small>`}<button class="rp-link" data-dq-action="overview">Ver as dez perguntas</button></div></section>`;
}
function duoView(){
 const d=duoState(),q=duoQuizState();
 if(q.page==='overview')return duoQuizOverview();
 if(q.page==='result')return duoQuizResult();
 if(d.phase==='mission')return `<div class="dq-mission-bar"><span>Os combinados da dupla continuam com vocês.</span><button class="rp-link" data-dq-action="result">Ver respostas da dupla →</button></div>`+duoMissionAppView();
 if(q.applied&&q.page==='setup')return `<div class="dq-mission-bar"><span>Vocês responderam às dez perguntas. Agora, deem forma ao projeto.</span><button class="rp-link" data-dq-action="result">Rever nosso ponto de partida →</button></div>`+duoMissionAppView();
 return duoQuizQuestionView();
}

root.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.dqOption!==undefined){
  const d=duoState(),q=duoQuizState(),p=b.dataset.dqPerson,v=Number(b.dataset.dqOption);
  if(d.phase!=='setup'||!['a','b'].includes(p)||!Number.isInteger(v)||v< -1||v>=5)return;
  q.answers[p][q.step]=v;q.applied=false;
  if([1,3].includes(q.step))q.roleChoices[p]=null;
  if([0,7].includes(q.step))q.routeChoice=null;
  render();return;
 }
 if(b.dataset.dqJump!==undefined){const d=duoState(),q=duoQuizState(),i=Number(b.dataset.dqJump);if(d.phase==='setup'&&Number.isInteger(i)&&i>=0&&i<10){q.step=i;q.page='questions';render()}return}
 if(b.dataset.dqRoute){if(duoState().phase==='setup'&&duoQuizComplete()&&Object.hasOwn(routes,b.dataset.dqRoute)){duoQuizState().routeChoice=b.dataset.dqRoute;render()}return}
 if(b.dataset.dqRolePerson){const p=b.dataset.dqRolePerson;if(duoState().phase==='setup'&&duoQuizComplete()&&['a','b'].includes(p)&&Object.hasOwn(duoRoles,b.dataset.dqRole)){duoQuizState().roleChoices[p]=b.dataset.dqRole;render()}return}
 if(b.dataset.duoRolePerson&&duoQuizState().applied)duoQuizState().roleChoices[b.dataset.duoRolePerson]=duoState().roles[b.dataset.duoRolePerson];
 if(b.dataset.duoRoute&&duoQuizState().applied)duoQuizState().routeChoice=duoState().route;
 switch(b.dataset.dqAction){
  case'next':{const d=duoState(),q=duoQuizState();if(d.phase!=='setup'||!['a','b'].every(p=>q.answers[p][q.step]!==null))break;if(q.step<9)q.step++;else{const missing=duoQuestions.findIndex((_,i)=>['a','b'].some(p=>q.answers[p][i]===null));if(missing>=0)q.step=missing;else{initializeDuoSuggestions();q.page='result'}}render();break;}
  case'back':{const q=duoQuizState();if(duoState().phase==='setup'&&q.step>0){q.step--;q.page='questions';render()}break;}
  case'overview':duoQuizState().page='overview';render();break;
  case'resume':{const q=duoQuizState();q.page='questions';const missing=duoQuestions.findIndex((_,i)=>['a','b'].some(p=>q.answers[p][i]===null));q.step=missing>=0?missing:0;render();break;}
  case'result':{const q=duoQuizState();if(duoQuizComplete()){initializeDuoSuggestions();q.page='result'}else q.page='questions';render();break;}
  case'apply':{const d=duoState(),q=duoQuizState();if(d.phase!=='setup'||!duoQuizCanApply())break;d.roles={...q.roleChoices};d.route=q.routeChoice;q.applied=true;q.page='setup';render();break;}
  case'mission':if(duoState().phase==='mission'){duoQuizState().page='setup';render()}break;
 }
});

let upRoute=null,upPanel='paths',upCopy=false;
function upKey(){return routeChosen?activeRoute:null}
function upTimePanel(){const m=upState().minutes;return `<section class="up-time"><span class="rp-overline">Cabe no seu dia</span><h2>Quanto tempo você tem agora?</h2><div class="up-options">${[10,20,30].map(n=>`<button data-up-minutes="${n}" aria-pressed="${m===n}">${n} min</button>`).join('')}</div><p>${m===10?'Faça só uma parte da tarefa: 2 min para escolher o recorte, 6 min para tentar e 2 min para anotar uma descoberta.':m===20?'Escolha um recorte em 3 min, experimente por 12 min e use os últimos 5 min para revisar e registrar.':'Prepare o recorte em 5 min, experimente por 20 min e registre o que percebeu nos últimos 5 min.'}</p><small>É uma sugestão de divisão do tempo, sem cronômetro obrigatório. Você pode parar e continuar depois.</small></section>`}
function upReflection(){const k=upKey();if(!k)return `<section class="up-box"><h2>Sua experiência vem primeiro.</h2><p>Escolha um caminho e registre uma tentativa no plano. Depois, volte para pensar no que gostaria de repetir.</p><button class="rp-button" data-up-panel="paths">Conhecer os caminhos →</button></section>`;const days=routineState[k].days.filter(d=>d.registered),r=upState().reflections[k];return `<section class="up-box"><span class="rp-overline">${routes[k].title} · ${days.length} registros</span><h2>Gostou ou foi diferente do que imaginava?</h2>${days.length?`<div class="up-records">${days.slice(-3).map(d=>`<p><strong>${esc(moodLabels[d.mood]||'Experiência registrada')}</strong>${d.note?' · '+esc(d.note):''}</p>`).join('')}</div><p>O que você quer fazer a partir dessa experiência?</p><div class="up-options">${[['continue','Quero continuar'],['adapt','Quero adaptar'],['change','Quero testar outra área']].map(([v,t])=>`<button data-up-reflect="${v}" aria-pressed="${r===v}">${t}</button>`).join('')}</div>${r?`<p class="up-response">${{continue:'Repita uma parte que deu vontade de continuar e aumente só um pouco o desafio.',adapt:'Mude uma coisa: o tamanho, o apoio ou o formato do projeto. Uma dificuldade não define sua capacidade.',change:'Você pode comparar outro caminho sem apagar o que já descobriu.'}[r]}</p><button class="rp-button" ${r==='change'?'data-y-nav="compare"':'data-route="'+k+'"'}>${r==='change'?'Comparar caminhos':'Voltar ao meu plano'} →</button>`:''}`:`<p>Você ainda não registrou uma experiência nessa área. Faça uma tentativa pequena antes de decidir com base na prática.</p><button class="rp-button" data-route="${k}">Abrir meu plano →</button>`}</section>`}

function getPlan(k){const base=routinePlans[k],state=routineState[k],project=projectFor(k);return {...base,intro:'Sete experiências curtas para sentir como é atuar nesta área. Não precisam acontecer em dias seguidos. Você não precisa gostar de todas.',focus:'Experimentar atividades diferentes de '+routes[k].title.toLowerCase()+'.',days:base.days.map((item,i)=>state.days[i].taskSnapshot||(i<7?[experimentalWeeks[k][i][0],experimentalWeeks[k][i][1]+(project?' Se fizer sentido, use como tema seu projeto “'+project.title+'”.':'')+' Ao registrar: '+experimentalWeeks[k][i][2]]:item))};}
function experimentWeekPreview(k){return `<section class="ex-week"><span class="rp-overline">Uma semana para sentir na prática</span><h2>7 testes. Nenhuma obrigação de acertar.</h2><p>Cada dia explora uma atividade diferente desta área. Você escolhe continuar, adaptar ou mudar depois de experimentar.</p><ol>${experimentalWeeks[k].map(([title,task,reflection],i)=>`<li><span class="ex-day">${i+1}</span><div><h3>${title}</h3><p>${task}</p><small>Perceba: ${reflection}</small></div></li>`).join('')}</ol><button class="rp-button" data-route="${k}">Quero experimentar esta área →</button></section>`}

Object.entries(experimentalWeeks).forEach(([k,week])=>{routinePlans[k].days=week.map(([title,task,reflection])=>[title,task+' Ao registrar: '+reflection]).concat(routinePlans[k].days.slice(7));});

function mentorReply(message,c,attachments=[]){
 const q=message.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const a=(target,label)=>({target,label});
 if(attachments.length)return {text:'Você adicionou '+attachments.length+' referência(s) para consultar nesta conversa. Eu não analiso imagens, PDFs ou a qualidade de projetos. Para revisar por conta própria: a ideia está clara, existe uma versão pequena concluída e qual ajuste você quer testar?',actions:[a('creations','Abrir minhas criações')]};
 if(/\b(gratis|gratuito|custa|custo|custos|pagar|preco|creditos|saldo)\b/.test(q))return {text:'O Mentor está incluído no seu acesso ao Rumo e não usa créditos. Minhas respostas são guiadas pelo Rumo, preparadas neste navegador. Posso ajudar a encontrar telas, entender os passos e começar uma tarefa curta.',actions:[a('paths','Conhecer caminhos')]};
 if(/\b(recomec|reinici|reset|apagar)/.test(q))return {text:'Você pode recomeçar sua jornada. Vou abrir a tela de confirmação; nada é apagado antes de você confirmar.',actions:[a('reset','Rever opção de recomeçar')]};
 if(/\b(inicio|inicial|home)\b/.test(q))return {text:'Vamos para o começo do Rumo.',actions:[a('home','Voltar ao início')]};
 if(/\b(configur|conta|senha|email|e-mail|tema|escuro|claro)/.test(q))return {text:'Em Configurações você vê sua conta, pode desconectar e escolher o tema claro ou escuro. Para recuperar a senha, use “Esqueci minha senha” na tela de entrada.',actions:[a('settings','Abrir configurações')]};
 if(/\b(dupla|amigo|juntos)\b/.test(q))return {text:'Em dupla, vocês respondem perguntas próprias e dividem uma experiência em tarefas. Cada pessoa continua livre para explorar seus interesses.',actions:[a('duo','Começar em dupla')]};
 if(/\b(passaporte|conquistas|descobertas)\b/.test(q))return {text:'O Passaporte reúne a reflexão sobre a sua semana. Registre as experiências do plano para perceber o que quer repetir ou mudar.',actions:[a('passport','Abrir passaporte')]};
 if(/\b(criacoes|portfolio|guardar|salvar|anotacoes)\b/.test(q))return {text:'Guarde textos, imagens e links em Minhas criações. Eles ficam neste navegador e dispositivo; nada é publicado automaticamente.',actions:[a('creations','Abrir minhas criações')]};
 if(/\b(questionario|perguntas|responder)\b/.test(q))return {text:'São dez perguntas curtas. Você pode escolher uma resposta, dizer que ainda não sabe e rever suas escolhas depois.',actions:[a('question','Abrir questionário')]};

function writeHostingDb(data){return new Promise((resolve,reject)=>{
 const tx=hostingDb.transaction('state','readwrite');tx.objectStore('state').put(data,HOSTING_KEY);
 tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Storage aborted'));
})}
function hostingStatus(failed){const label=root.querySelector('.rp-foot span');if(label)label.textContent=failed?'Não foi possível salvar neste navegador. Mantenha a página aberta e verifique o espaço disponível.':'Sua jornada · progresso salvo neste navegador'}
async function flushHostedSave(){
 if(hostingWriting)return;hostingWriting=true;
 while(hostingPending){const data=hostingPending;hostingPending=null;try{if(hostingDb)await writeHostingDb(data);else localStorage.setItem(HOSTING_KEY,JSON.stringify(data));hostingStatus(false)}catch{hostingStatus(true)}}
 hostingWriting=false;
}
function scheduleHostedSave(){if(!hostingReady||!authUser)return;hostingPending=captureHostedState();void flushHostedSave()}
root.addEventListener('click',scheduleHostedSave);
root.addEventListener('change',scheduleHostedSave);
root.addEventListener('input',()=>{clearTimeout(hostingInputTimer);hostingInputTimer=setTimeout(scheduleHostedSave,200)});
window.addEventListener('pagehide',scheduleHostedSave);
async function bootHostedApp(){
 let saved=null;
 try{hostingDb=await openHostingDb();saved=await readHostingDb()}catch{hostingDb=null;try{saved=JSON.parse(localStorage.getItem(HOSTING_KEY)||'null')}catch{}}
 try{restoreHostedState(saved)}catch{youth=newYouth();routineState=freshRoutes();answers=Array(10).fill(null);routeChosen=false;activeRoute='creative';step=0;interestFocus=null}
 hostingReady=true;catalogue=false;view='home';render();scheduleHostedSave();
}

try{applyRumoTheme(localStorage.getItem('rumo.appearance'))}catch{applyRumoTheme('dark')}

let authUser=null,authMode='login',authEmail='',authIntent=null,authBusy=false;
async function authCall(action,data={}){
 const res=await fetch('/.netlify/functions/auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
 let body;try{body=await res.json()}catch{throw new Error('O login precisa ser conectado à hospedagem para funcionar.')}
 if(!res.ok)throw new Error(body.error||'Não foi possível entrar.');
 return body;
}
function authView(){
 const titles={login:'Seu próximo capítulo começa aqui.',signup:'Crie sua conta. Encontre seu rumo.',recover:'Vamos recuperar seu acesso.',verify:'Confirme seu e-mail.',recovery:'Confira seu e-mail.',password:'Escolha uma nova senha.'};
 const otp=['verify','recovery'].includes(authMode),pass=['login','signup','password'].includes(authMode);
 return '<section class="ra-page"><button class="rp-link" data-auth-mode="home">← Voltar ao início</button><div class="ra-card"><span class="ra-kicker">SUA JORNADA NO RUMO</span><h1>'+titles[authMode]+'</h1><p>'+ (otp?'Digite o código de seis números enviado para '+esc(authEmail)+'.':'Entre para explorar caminhos, criar projetos e continuar sua jornada.')+'</p><form id="ra-form">'+
 (authMode!=='password'?'<label>E-mail<input required name="email" type="email" autocomplete="email" maxlength="254" value="'+esc(authEmail)+'" placeholder="voce@exemplo.com"></label>':'')+
 (pass?'<label>'+ (authMode==='password'?'Nova senha':'Senha')+'<span class="ra-password-wrap"><input required name="password" type="password" autocomplete="'+(authMode==='login'?'current-password':'new-password')+'" minlength="'+(authMode==='login'?1:10)+'" maxlength="128"><button type="button" class="ra-password-toggle" data-password-toggle aria-label="Mostrar senha">Mostrar</button></span></label>'+(authMode==='signup'?'<label>Confirme sua senha<span class="ra-password-wrap"><input required name="passwordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128"><button type="button" class="ra-password-toggle" data-password-toggle aria-label="Mostrar confirmação da senha">Mostrar</button></span></label>':'')+(authMode==='login'?'':'<small>Use pelo menos 10 caracteres. Pode ser qualquer combinação de letras, números e símbolos.</small>'):'')+
 (otp?'<label>Código de confirmação<input name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>':'')+
 '<p id="ra-status" role="status" aria-live="polite"></p><button class="rp-button ra-submit" type="submit">'+({login:'Entrar',signup:'Criar conta',recover:'Enviar código',verify:'Confirmar e continuar',recovery:'Confirmar código',password:'Salvar nova senha'}[authMode])+'</button></form><div class="ra-links">'+
 (authMode==='login'?'<button class="rp-link" data-auth-mode="signup">Ainda não tenho conta</button><button class="rp-link" data-auth-mode="recover">Esqueci minha senha</button><button class="rp-link" data-auth-mode="verify-entry">Já recebi um código</button>':'<button class="rp-link" data-auth-mode="login">Voltar para entrar</button>')+
 (otp?'<button class="rp-link" data-auth-resend>Reenviar código</button>':'')+
 '</div><small>Seu progresso fica neste navegador, separado por conta.</small></div></section>';
}
function showAuth(mode='login'){
 closeMenu();authMode=mode;view='auth';render();
 stage.querySelector('input')?.focus({preventScroll:true});
}
const beforeAuthRender=render;
render=function(){
 if(!authUser&&!['home','landing','auth'].includes(view)){view='auth';authMode='login'}
 if(view==='auth'){root.dataset.screen='auth';stage.innerHTML=authView();return}
 beforeAuthRender();
 let out=navigation.querySelector('[data-auth-logout]');
 if(authUser&&!out){out=document.createElement('button');out.className='rp-drawer-item';out.dataset.authLogout='true';out.textContent='Sair da conta';navigation.querySelector('nav').append(out)}
 if(!authUser)out?.remove();
};
const beforeAuthNavigate=navigate;
navigate=function(next){if(!authUser&&!['home','landing'].includes(next)){authIntent=()=>beforeAuthNavigate(next);showAuth();return}beforeAuthNavigate(next)};
const beforeAuthOpenMenu=openMenu;
openMenu=function(){if(!authUser){authIntent=()=>beforeAuthOpenMenu();showAuth();return}beforeAuthOpenMenu()};
root.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.closest('.ra-page')||b.hasAttribute('data-auth-logout'))return;
 if(!authUser&&b.dataset.act!=='home'){
  e.preventDefault();e.stopImmediatePropagation();
  const attrs=[...b.attributes].filter(a=>a.name.startsWith('data-'));
  authIntent=()=>{
   const target=[...root.querySelectorAll('button,a')].find(el=>attrs.length&&attrs.every(a=>el.getAttribute(a.name)===a.value));
   target?.click();
  };
  showAuth();
 }
},true);
function clearJourney(){
 clearTimeout(appLicenseTimer);appLicense=null;appLicenseDeadline=0;purchaseRequest++;purchaseOrders=null;purchaseError='';purchaseBusy=false;
 resetPortal();
 hostingReady=false;hostingPending=null;clearTimeout(hostingInputTimer);
 mapNeedsReview=false;youth=newYouth();routineState=freshRoutes();answers=Array(10).fill(null);routeChosen=false;activeRoute='creative';step=0;interestFocus=null;passportDemo=false;demoSnapshot=null;catalogue=false;
}
async function acceptUser(user){
 if(!user||typeof user.id!=='string')throw new Error('Sessão inválida.');
 clearJourney();authUser=user;HOSTING_KEY='rumo.account.v1.'+user.id;
 await bootHostedApp();await checkAppLicense();if(appLicense?.allowed!==true)return;recordPortalEvent('visit');void checkPortalAccess();const intent=authIntent;authIntent=null;intent?.();
}
root.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.authMode){
  if(authBusy)return;
  if(b.dataset.authMode==='home'){authIntent=null;view='home';render();return}
  if(b.dataset.authMode==='verify-entry'){showAuth('verify');return}
  showAuth(b.dataset.authMode);return;
 }
 if(b.hasAttribute('data-password-toggle')){const input=b.parentElement.querySelector('input');const visible=input.type==='text';input.type=visible?'password':'text';b.textContent=visible?'Mostrar':'Ocultar';b.setAttribute('aria-label',visible?'Mostrar senha':'Ocultar senha');return;}
 if(b.hasAttribute('data-auth-resend')){
  if(authBusy)return;authBusy=true;b.disabled=true;
  try{const r=await authCall(authMode==='recovery'?'recover':'resend',{email:authEmail});stage.querySelector('#ra-status').textContent=r.message}catch(err){stage.querySelector('#ra-status').textContent=err.message}
  finally{authBusy=false;b.disabled=false}return;
 }
 if(b.hasAttribute('data-auth-logout')){
  if(authBusy)return;authBusy=true;
  root.querySelectorAll('[data-auth-logout]').forEach(el=>el.disabled=true);
  const status=stage.querySelector('#ts-account-status');if(status)status.textContent='Desconectando sua conta…';
  try{await authCall('logout');mentorRecognition?.stop();if(typeof speechSynthesis!=='undefined')speechSynthesis.cancel();authUser=null;authIntent=null;clearJourney();closeMenu();view='home';render()}
  catch(err){live.textContent=err.message;const message=stage.querySelector('#ts-account-status');if(message)message.textContent=err.message}
  finally{authBusy=false;root.querySelectorAll('[data-auth-logout]').forEach(el=>el.disabled=false)}
 }
});
root.addEventListener('submit',async e=>{
 if(e.target.id!=='ra-form')return;e.preventDefault();if(authBusy)return;
 const form=e.target,fields=new FormData(form),button=form.querySelector('[type=submit]'),status=form.querySelector('#ra-status');
 authEmail=String(fields.get('email')||authEmail).trim();
 if(authMode==='signup'&&fields.get('password')!==fields.get('passwordConfirm')){status.textContent='As senhas não coincidem. Digite a mesma senha nos dois campos.';form.querySelector('[name=passwordConfirm]').focus();return;}
 authBusy=true;button.disabled=true;status.textContent='Aguarde…';
 try{
  if(authMode==='login'){const r=await authCall('login',{email:authEmail,password:fields.get('password')});await acceptUser(r.user)}
  else if(authMode==='signup'){const r=await authCall('signup',{email:authEmail,password:fields.get('password')});showAuth('verify');stage.querySelector('#ra-status').textContent=r.message}
  else if(authMode==='recover'){const r=await authCall('recover',{email:authEmail});showAuth('recovery');stage.querySelector('#ra-status').textContent=r.message}
  else if(['verify','recovery'].includes(authMode)){const recovery=authMode==='recovery';const r=await authCall('verify',{email:authEmail,code:fields.get('code'),type:recovery?'recovery':'signup'});if(recovery)showAuth('password');else await acceptUser(r.user)}
  else if(authMode==='password'){await authCall('password',{password:fields.get('password')});authUser=null;clearJourney();showAuth('login');stage.querySelector('#ra-status').textContent='Senha atualizada. Entre com sua nova senha.'}
 }catch(err){status.textContent=err.message}
 finally{const pw=form.querySelector('[name=password]');if(pw)pw.value='';authBusy=false;button.disabled=false}
});
async function initAuth(){
 view='home';render();
 try{const r=await authCall('session');if(view!=='auth'){await acceptUser(r.user);if(appLicense?.allowed===true){const topic=new URLSearchParams(location.search).get('tema');if(topic&&Object.hasOwn(youthTopics,topic)){youth.topic=topic;interestFocus=youthTopics[topic].label;}const destination=location.hash.slice(1);if(destination==='admin'){await checkPortalAccess();if(portalAdmin){navigate('admin');void loadPortal();}}else if(['question','duo','mentor'].includes(destination))navigate(destination);}}}catch{/* A sessão e a licença continuam sendo verificadas no servidor. */}
}

let authChecking=false;
window.addEventListener('focus',async()=>{
 if(!authUser||authChecking)return;authChecking=true;
 const id=authUser.id;
 try{const r=await authCall('session');if(r.user.id!==id)location.reload()}
 catch{authUser=null;clearJourney();showAuth('login');}
 finally{authChecking=false}
});

let portalAdmin=false,portalAccessUser='',portalData=null,portalBusy=false,portalError='',portalDays=30,portalTab='overview',portalPage=0,portalFilter='all',portalRequest=0;
const portalApi=(operation,data={})=>authCall('portal',{operation,data});
function resetPortal(){portalRequest++;portalAdmin=false;portalAccessUser='';portalData=null;portalError='';portalBusy=false;portalPage=0;portalTab='overview';root.querySelector('[data-admin-nav]')?.remove();}
async function checkPortalAccess(){
 const id=authUser?.id;if(!id)return;portalAccessUser=id;
 try{const data=await portalApi('access');if(authUser?.id!==id||portalAccessUser!==id)return;portalAdmin=data?.admin===true;}
 catch{if(authUser?.id===id)portalAdmin=false;}
 syncPortalMenu();
}
function syncPortalMenu(){
 let button=root.querySelector('[data-admin-nav]');
 if(!portalAdmin||!authUser){button?.remove();return;}
 if(!button){button=document.createElement('button');button.className='rp-drawer-item';button.dataset.adminNav='true';button.innerHTML='<span class="rp-drawer-icon"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i></span><span class="rp-drawer-copy"><strong>Painel administrativo</strong><small>Acompanhamento exclusivo do Rumo</small></span>';navigation.querySelector('[data-act="support"]').after(button);}
 button.classList.toggle('rp-current',view==='admin');if(view==='admin')button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
 if(typeof lucide!=='undefined')lucide.createIcons();
}
async function loadPortal(){
 if(!portalAdmin||!authUser)return;const request=++portalRequest,id=authUser.id;portalBusy=true;portalError='';if(view==='admin')render();
 try{const data=await portalApi('dashboard',{days:portalDays,page:portalPage,status:portalFilter});if(request!==portalRequest||authUser?.id!==id)return;portalData=data;}
 catch(error){if(request!==portalRequest||authUser?.id!==id)return;portalData=null;portalError=error.message;}
 finally{if(request===portalRequest){portalBusy=false;if(view==='admin')render();}}
}

ídas. Os números de uso dependem das ações registradas pelo aplicativo.</p></footer>`:''}</section>`;

function recordPortalEvent(kind,data={}){
 if(!authUser||passportDemo)return;
 void portalApi('event',{kind,...data}).catch(()=>{});
}
root.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.hasAttribute('data-admin-nav')){if(portalAdmin){navigate('admin');void loadPortal();}return;}
 if(b.hasAttribute('data-admin-refresh')){void loadPortal();return;}
 if(b.dataset.adminTab){portalTab=b.dataset.adminTab;if(['overview','reviews','support','purchases'].includes(portalTab))render();return;}
 if(b.dataset.adminPage!==undefined){portalPage=Math.max(0,Number(b.dataset.adminPage));void loadPortal();return;}
 if(b.dataset.upRoute&&Object.hasOwn(routes,b.dataset.upRoute))recordPortalEvent('route_view',{route:b.dataset.upRoute});
 if(b.classList.contains('su-whatsapp'))recordPortalEvent('whatsapp');
});
root.addEventListener('change',async e=>{
 const el=e.target;
 if(el.matches('[data-admin-days]')){portalDays=Number(el.value);portalPage=0;void loadPortal();}
 if(el.matches('[data-admin-filter]')){portalFilter=el.value;portalPage=0;void loadPortal();}
 if(el.dataset.adminTicket){el.disabled=true;try{await portalApi('ticket_status',{id:el.dataset.adminTicket,status:el.value});await loadPortal();}catch(error){portalError=error.message;render();}}

function supportForms(){return `<section class="su-forms"><article class="ad-card"><span class="rp-overline">PREFERE REGISTRAR POR AQUI?</span><h2>Envie um pedido de suporte.</h2><p>Sua mensagem e o e-mail da conta serão enviados à administração do Rumo para atendimento. Não envie senhas ou códigos.</p><form data-support-form><label>Assunto<select name="category" required>${Object.entries(ticketCategories).map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label><label>Como podemos ajudar?<textarea name="message" rows="4" minlength="10" maxlength="1500" required placeholder="Conte o que aconteceu e em qual tela…"></textarea></label><button class="rp-button" type="submit">Enviar pedido →</button><p role="status" data-form-status></p></form></article><article class="ad-card"><span class="rp-overline">AJUDE O RUMO A EVOLUIR</span><h2>Como está sendo usar o app?</h2><p>Sua avaliação ajuda a melhorar a experiência. Envie apenas o que quiser compartilhar com a administração.</p><form data-review-form><fieldset class="su-rating"><legend>Sua nota para o Rumo</legend>${[1,2,3,4,5].map(v=>`<label><input type="radio" name="rating" value="${v}" required><span>${v} ★</span></label>`).join('')}</fieldset><label>O que podemos melhorar? <small>(opcional)</small><textarea name="comment" rows="4" maxlength="500" placeholder="Uma ideia, uma dificuldade ou algo que você gostou…"></textarea></label><button class="rp-button rp-secondary" type="submit">Enviar avaliação →</button><p role="status" data-form-status></p></form></article></section>`;}
root.addEventListener('submit',async e=>{

 button.disabled=true;status.textContent='Enviando…';const fields=new FormData(form),isSupport=form.hasAttribute('data-support-form');
 try{const result=await portalApi(isSupport?'ticket':'review',isSupport?{category:fields.get('category'),message:fields.get('message')}:{rating:Number(fields.get('rating')),comment:fields.get('comment')});if(authUser?.id!==id)return;status.textContent=isSupport?'Pedido enviado. Protocolo '+result.id.slice(0,8).toUpperCase()+'. A equipe poderá responder pelo e-mail da sua conta.':'Avaliação salva. Obrigado por ajudar o Rumo a melhorar!';form.reset();}

const beforePortalNavigate=navigate;
navigate=function(next){beforePortalNavigate(next);if(view===next&&authUser){if(next==='question')recordPortalEvent('quiz_start');if(next==='routine')recordPortalEvent('route_view',{route:activeRoute});}syncPortalMenu();};

// O Worker entrega este HTML apenas com licença válida; o app mantém a verificação durante o uso.
let appLicense=null,appLicenseTimer=null,appLicenseChecking=false,appLicenseDeadline=0;
const appLicenseApi=(operation,data={})=>authCall('license',{operation,data});
async function checkAppLicense(){
 if(!authUser||appLicenseChecking)return;appLicenseChecking=true;
 try{
  const id=authUser.id,state=await appLicenseApi('status');if(authUser?.id!==id)return;
  appLicense=state;
  if(state.allowed!==true){scheduleHostedSave();location.replace('/?comprar=1');return;}
  root.inert=false;document.querySelector('#lp-access-block')?.remove();
  appLicenseDeadline=state.state==='trial'?performance.now()+Math.max(0,new Date(state.trialExpiresAt)-new Date(state.serverNow)):0;
  let banner=root.querySelector('.lp-banner');if(!banner){banner=document.createElement('div');banner.className='lp-banner';root.querySelector('.rp-home-bar,header').after(banner);}
  const label=state.state==='trial'?'Teste de 24 horas · termina em '+new Date(state.trialExpiresAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):state.state==='admin'?'Conta administradora · acesso liberado':'Acesso vitalício liberado';
  banner.innerHTML='<span>'+esc(label)+'</span><a href="/?comprar=1">Meu acesso '+(state.state==='trial'?'· comprar por R$ 19,90':'')+' ↗</a>';
  clearTimeout(appLicenseTimer);appLicenseTimer=setTimeout(checkAppLicense,appLicenseDeadline?Math.max(500,Math.min(120000,appLicenseDeadline-performance.now())):120000);
 }catch{
  // Sem confirmação do servidor, não permite continuar offline após uma verificação falhar.
  root.inert=true;let block=document.querySelector('#lp-access-block');
  if(!block){block=document.createElement('section');block.id='lp-access-block';block.setAttribute('role','dialog');block.setAttribute('aria-modal','true');block.setAttribute('aria-label','Verificar acesso');block.style.cssText='position:fixed;inset:0;z-index:30000;background:#0b0d14;color:#fff;display:grid;place-content:center;padding:30px;font:16px/1.7 system-ui';block.innerHTML='<h1>Vamos conferir seu acesso.</h1><p>Não foi possível conectar ao servidor. Seus registros continuam neste navegador.</p><button id="lp-access-retry" style="background:#c7ff62;color:#102005;border:0;border-radius:12px;padding:16px;font:inherit">Tentar novamente</button><a href="/?comprar=1" style="color:white;margin-top:20px">Abrir minha conta e suporte →</a>';document.body.append(block);block.querySelector('button').addEventListener('click',()=>void checkAppLicense());}
 }finally{appLicenseChecking=false;}
}
window.addEventListener('focus',()=>void checkAppLicense());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)void checkAppLicense();});
let purchaseOrders=null,purchaseBusy=false,purchaseError='',purchaseFilter='review',purchasePage=0,purchaseRequest=0;
async function loadPurchaseOrders(){
 if(!portalAdmin||!authUser)return;const request=++purchaseRequest,id=authUser.id;purchaseBusy=true;purchaseError='';render();
 try{const d=await appLicenseApi('orders',{status:purchaseFilter,page:purchasePage});if(request!==purchaseRequest||authUser?.id!==id)return;purchaseOrders=d;}
 catch(e){if(request!==purchaseRequest||authUser?.id!==id)return;purchaseOrders=null;purchaseError=e.message;}
 finally{if(request===purchaseRequest){purchaseBusy=false;if(view==='admin')render();}}
}
const purchaseStatus={pending:'Pix preparado',reported:'Aguardando conferência',approved:'Vitalício liberado',rejected:'Não confirmado',expired:'Código encerrado'};
function purchaseAdminView(){
 return `<section class="ad-card"><div class="ad-card-head"><div><span class="rp-overline">RUMO · PAGAMENTO ÚNICO</span><h2>Compras e acesso vitalício.</h2></div><label class="ad-select">Pedidos<select data-purchase-filter>${[['review','Para conferir'],['all','Todos'],...Object.entries(purchaseStatus)].map(([v,t])=>`<option value="${v}" ${v===purchaseFilter?'selected':''}>${t}</option>`).join('')}</select></label></div><p class="ad-fine">R$ 19,90 por conta · Pix manual. Abra seu banco e confira o recebimento, o valor e a identificação antes de liberar. Um comprovante ou a informação do cliente, isoladamente, não confirma o recebimento.</p><button class="rp-link" data-purchase-refresh>Atualizar pedidos ↻</button>${purchaseError?`<p class="lp-error" role="alert">${esc(purchaseError)}</p>`:purchaseBusy&&!purchaseOrders?'<p role="status">Buscando compras…</p>':purchaseOrders?.orders?.length?purchaseOrders.orders.map(o=>`<article class="ad-ticket"><div class="ad-ticket-top"><strong>R$ ${(o.amount_cents/100).toFixed(2).replace('.',',')} · ${esc(o.email)}</strong><span class="ad-status">${esc(purchaseStatus[o.status])}</span></div><p class="ad-fine">Protocolo ${esc(o.id.slice(0,8).toUpperCase())} · ${esc(o.reference)}<br>Criado em ${esc(adminDate(o.created_at))}${o.reported_at?'<br>Pagamento informado em '+esc(adminDate(o.reported_at)):''}</p>${o.status==='approved'?`<p class="ad-fine">Liberado em ${esc(adminDate(o.reviewed_at))} · Transação bancária: ${esc(o.bank_reference)}</p>`:o.status==='rejected'?'<p class="ad-fine">Pedido não confirmado. Se houver pagamento, trate com o cliente antes de solicitar um novo Pix.</p>':`<form class="lp-approve" data-license-approve="${esc(o.id)}"><label>Identificador da transação recebida no seu banco<input name="bankReference" type="text" minlength="10" maxlength="100" required autocomplete="off" placeholder="Cole o identificador da transação Pix"></label><label class="lp-check"><input name="confirmed" type="checkbox" required><span>Conferi no meu banco o recebimento de <strong>R$ 19,90</strong> referente a este pedido. Quero liberar o acesso vitalício desta conta.</span></label><div class="rp-actions"><button class="rp-button" type="submit">Confirmar recebimento e liberar →</button><button class="rp-button rp-secondary" type="button" data-license-reject="${esc(o.id)}">Pagamento não localizado</button></div><p role="status" data-license-admin-status></p></form>`}</article>`).join(''):adminEmpty('Nenhuma compra neste filtro. Os pedidos aparecem quando uma pessoa prepara o Pix e informa o pagamento.')}<div class="ad-pagination"><button class="rp-button rp-secondary" data-purchase-page="${purchasePage-1}" ${purchasePage===0?'disabled':''}>← Anterior</button><span>Página ${purchasePage+1}</span><button class="rp-button rp-secondary" data-purchase-page="${purchasePage+1}" ${!purchaseOrders||(purchasePage+1)*20>=purchaseOrders.total?'disabled':''}>Próxima →</button></div></section>`;
}
root.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.adminTab==='purchases'&&portalAdmin)void loadPurchaseOrders();
